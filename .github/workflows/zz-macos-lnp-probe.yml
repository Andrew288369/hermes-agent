# TEMPORARY probe, never merge: macOS Local Network Privacy vs a detached child that outlives
# the app responsible for it (Discord thread 1564067768146600017, Desktop-attached gateway).
name: zz macOS LNP probe (temporary)

on:
  push:
    branches: ["proof/macos-lnp-gateway"]

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          sparse-checkout: .github/lnp-probe
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
      - name: uv-managed python (same kind of interpreter as the Hermes venv)
        timeout-minutes: 5
        run: |
          uv python install 3.12
          echo "PROBE_PY=$(uv python find 3.12)" >> "$GITHUB_ENV"
      - name: probe
        timeout-minutes: 15
        run: python3 .github/lnp-probe/driver.py "$RUNNER_TEMP/lnp" "$PROBE_PY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lnp-${{ matrix.os }}
          path: ${{ runner.temp }}/lnp
